title: Maestro Test
summary: Runs Maestro flows on an Android emulator or iOS simulator running on the Bitrise machine, and exports the results to Test Reports.
description: |-
  Runs your [Maestro](https://maestro.dev) flows locally on the build machine and exports the results.

  The Step installs the Maestro CLI, optionally installs your app on the device, runs `maestro test`, and exports:
  - the results to the Test Reports page, with each flow's screenshots, `startRecording` videos and logs attached to its test case
  - the Maestro test output folder as a zip artifact

  Add **Deploy to Bitrise.io** after this Step to upload the results.

  #### Device

  The Step does not start a device. Start one earlier in the Workflow:
  - Android: **AVD Manager** and **Wait for Android emulator**
  - iOS: **Xcode Start Simulator**

  Maestro supports iOS simulators only, not physical iPhones.

  #### Flow variables

  Maestro passes every environment variable with the `MAESTRO_` prefix to the flows, so an Env Var or Secret named `MAESTRO_USERNAME` is available as `${MAESTRO_USERNAME}`. To pass a variable under a different name, use `-e` in **Additional maestro test arguments**, for example `-e USERNAME=$TEST_ACCOUNT_USERNAME`.

  #### Java

  The Maestro CLI needs Java 17 or newer. Java 17 is the default on Bitrise stacks.

website: https://github.com/bitrise-steplib/bitrise-step-maestro-test
source_code_url: https://github.com/bitrise-steplib/bitrise-step-maestro-test
support_url: https://github.com/bitrise-steplib/bitrise-step-maestro-test/issues

host_os_tags:
- osx-10.10
- ubuntu-16.04

project_type_tags:
- ios
- android
- react-native
- flutter

type_tags:
- test

is_skippable: false

toolkit:
  go:
    package_name: github.com/bitrise-steplib/bitrise-step-maestro-test

inputs:
- flow_path: .maestro
  opts:
    title: Flow path
    summary: A Maestro flow file or a folder containing flow files.
    description: |-
      A Maestro flow file or a folder containing flow files. If the folder has a `config.yaml`, Maestro uses it.
    is_required: true

- app_path: ""
  opts:
    title: App path
    summary: Optional path to an .apk (Android) or a simulator .app (iOS) to install before running the flows.
    description: |-
      Optional path to the app to install on the device before running the flows.

      - Android: an `.apk`, for example the `$BITRISE_APK_PATH` output of **Android Build**
      - iOS: a simulator `.app`, for example the `$BITRISE_APP_DIR_PATH` output of **Xcode Build for Simulator**

      Leave it empty if the app is already installed. When it is set, the Step also checks that a matching device is running.
    is_required: false

- include_tags: ""
  opts:
    title: Include tags
    summary: Run only the flows that have at least one of these tags (comma or newline separated).
    is_required: false

- exclude_tags: ""
  opts:
    title: Exclude tags
    summary: Skip the flows that have any of these tags (comma or newline separated).
    is_required: false

- test_name: Maestro
  opts:
    title: Test name
    summary: The name the results are shown under on the Test Reports page.
    is_required: true

- maestro_version: ""
  opts:
    category: Debugging
    title: Maestro CLI version override
    summary: Leave empty to use the Maestro CLI version this Step release was tested with.
    description: |-
      Leave empty to use the Maestro CLI version this Step release was tested with. The Step logs which version it installs.

      Set it only when you need a different version before a new Step release ships it, for example `2.12.0`. Untested versions can run your flows, but the Step's test output handling is only guaranteed for the tested version.

      See the [Maestro releases](https://github.com/mobile-dev-inc/maestro/releases).
    is_required: false

- additional_args: ""
  opts:
    category: Debugging
    title: Additional maestro test arguments
    summary: Extra arguments appended to the `maestro test` command.
    description: |-
      Extra arguments appended to the `maestro test` command, for example `-e USERNAME=$TEST_ACCOUNT_USERNAME` or `--no-reinstall-driver`.
    is_required: false

- bitrise_test_result_dir: $BITRISE_TEST_RESULT_DIR
  opts:
    category: Debugging
    title: Step's test result directory
    summary: The per-step folder the Bitrise CLI creates for test results.
    is_required: true
    is_dont_change_value: true

outputs:
- MAESTRO_JUNIT_PATH:
  opts:
    title: JUnit report path
    summary: Path to the JUnit report written by Maestro.

- MAESTRO_TEST_OUTPUT_ZIP_PATH:
  opts:
    title: Test output zip path
    summary: Path to the zipped Maestro test output folder (screenshots, logs, recordings) in the deploy directory.
